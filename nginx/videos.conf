# nginx/videos.conf
# Copiar para /etc/nginx/sites-available/ead-distrito-manaus e ativar

server {
    listen 80;
    server_name ead-distrito-manaus.com.br;

    # Redireciona para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ead-distrito-manaus.com.br;

    ssl_certificate /etc/letsencrypt/live/ead-distrito-manaus.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ead-distrito-manaus.com.br/privkey.pem;

    # App Next.js via PM2
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Vídeos protegidos por JWT (auth_request)
    location /videos/ {
        # Valida o token antes de servir
        auth_request /api/auth-video;
        auth_request_set $auth_status $upstream_status;

        # Passa a URL original para a API de validação
        auth_request_set $original_uri $request_uri;

        # Serve os arquivos MP4
        alias /home/ead/videos/;
        add_header Cache-Control "private, no-cache";

        # Suporte a range requests (seek no player)
        add_header Accept-Ranges bytes;
    }

    # Rota interna de validação (não acessível externamente)
    location = /api/auth-video {
        internal;
        proxy_pass http://127.0.0.1:3000/api/auth-video?url=$request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
}
